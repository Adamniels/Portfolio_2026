<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clean Architecture dependency direction</title><desc id="desc">Domain rules sit at the center, application use cases and contracts surround them, infrastructure implements those contracts, and the API composes the system at the edge.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8ff32"/></marker><style>.bg{fill:#171715}.outer{fill:#22221f;stroke:#55554f;stroke-width:2}.infra{fill:#292925;stroke:#686861;stroke-width:2}.app{fill:#28483c;stroke:#789b8d;stroke-width:2}.domain{fill:#c8ff32}.title{fill:#f0eee8;font:600 52px Arial}.h{fill:#f0eee8;font:600 23px Arial}.darkh{fill:#17221d;font:600 23px Arial}.copy{fill:#b8b7af;font:17px Arial}.darkcopy{fill:#355246;font:16px Arial}.mono{fill:#8d8c84;font:16px ui-monospace,monospace;letter-spacing:2px}.num{fill:#c8ff32;font:16px ui-monospace,monospace}.line{fill:none;stroke:#c8ff32;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="75">CLEAN ARCHITECTURE / DEPENDENCY DIRECTION</text><text class="title" x="90" y="142">External choices point inward.</text><text class="copy" x="90" y="182">CRM, models, scraping, and delivery implement contracts owned by the application.</text>
  <g transform="translate(90 250)"><rect class="outer" width="950" height="540"/><text class="num" x="25" y="38">API / COMPOSITION EDGE</text><rect class="infra" x="65" y="70" width="820" height="420"/><text class="num" x="90" y="105">INFRASTRUCTURE IMPLEMENTATIONS</text><rect class="app" x="145" y="135" width="660" height="290"/><text class="num" x="170" y="170">APPLICATION USE CASES + CONTRACTS</text><rect class="domain" x="260" y="200" width="430" height="160"/><text class="darkh" x="290" y="250">DOMAIN RULES</text><text class="darkcopy" x="290" y="286">Prospect · Contact · Workflow</text><text class="darkcopy" x="290" y="317">State transitions and invariants</text></g>
  <path class="line" d="M1200 330H1040"/><text class="mono" x="1180" y="315">HTTP ENDPOINT</text>
  <path class="line" d="M1200 450H895"/><text class="mono" x="1180" y="435">USE CASE</text>
  <path class="line" d="M1200 570H780"/><text class="mono" x="1180" y="555">DOMAIN METHOD</text>
  <path class="line" d="M1200 690H975"/><text class="mono" x="1180" y="675">REPOSITORY CONTRACT</text>
  <g transform="translate(1130 250)"><rect class="outer" width="380" height="540"/><text class="num" x="25" y="42">EXAMPLE TRACE</text><text class="h" x="25" y="96">POST / workflows</text><text class="copy" x="25" y="130">Thin endpoint</text><path class="line" d="M45 155V195"/><text class="h" x="25" y="230">ActivateWorkflow</text><text class="copy" x="25" y="264">Single Handle entry</text><path class="line" d="M45 290V330"/><text class="h" x="25" y="365">Workflow.Activate</text><text class="copy" x="25" y="399">Owns invariants</text><path class="line" d="M45 425V465"/><text class="h" x="25" y="500">IWorkflowRepository</text><text class="copy" x="25" y="534">Implemented outside</text></g>
  <text class="mono" x="90" y="850">TRADEOFF / MORE TYPES AND WIRING IN EXCHANGE FOR REPLACEABLE EDGES</text>
</svg>
