<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Parallel evidence collection</title><desc id="desc">First-party pages and external signals are collected separately and concurrently before synthesis.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8ff32"/></marker><style>.bg{fill:#171715}.card{fill:#242421;stroke:#55554f;stroke-width:2}.green{fill:#27473b;stroke:#729889;stroke-width:2}.tag{fill:#c8ff32}.title{fill:#f0eee8;font:600 52px Arial}.h{fill:#f0eee8;font:600 26px Arial}.copy{fill:#b7b6ae;font:18px Arial}.mono{fill:#8d8c84;font:17px ui-monospace,monospace;letter-spacing:2px}.num{fill:#c8ff32;font:17px ui-monospace,monospace}.line{fill:none;stroke:#c8ff32;stroke-width:3;marker-end:url(#a)}.soft{fill:none;stroke:#66665f;stroke-width:2}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="78">ENRICHMENT / 01 COLLECT</text><text class="title" x="90" y="145">Two evidence tracks run in parallel.</text><text class="copy" x="90" y="185">Stable company facts and recent signals have different source strengths.</text>
  <g transform="translate(90 300)"><rect class="green" width="260" height="210"/><text class="num" x="25" y="40">INPUT</text><text class="h" x="25" y="92">Northstar Energy</text><text class="copy" x="25" y="132">northstar.example</text><rect class="tag" x="25" y="160" width="118" height="24"/><text x="36" y="177" font-family="ui-monospace,monospace" font-size="12" fill="#17221d">PROSPECT 014</text></g>
  <path class="line" d="M350 405H435V325H505"/><path class="line" d="M435 405V635H505"/>
  <g transform="translate(505 235)"><rect class="card" width="440" height="250"/><text class="num" x="28" y="42">TRACK A / FIRST PARTY</text><text class="h" x="28" y="92">Website evidence</text><text class="copy" x="28" y="132">About and service pages</text><text class="copy" x="28" y="165">Positioning and capabilities</text><text class="copy" x="28" y="198">Stable company facts</text><path class="soft" d="M28 220H412"/></g>
  <g transform="translate(505 545)"><rect class="card" width="440" height="250"/><text class="num" x="28" y="42">TRACK B / EXTERNAL</text><text class="h" x="28" y="92">Market signals</text><text class="copy" x="28" y="132">Recent announcements</text><text class="copy" x="28" y="165">Role and contact candidates</text><text class="copy" x="28" y="198">Potential outreach hooks</text><path class="soft" d="M28 220H412"/></g>
  <path class="line" d="M945 360H1085"/><path class="line" d="M945 670H1015V360H1085"/>
  <g transform="translate(1085 300)"><rect class="green" width="425" height="310"/><text class="num" x="30" y="45">COLLECTED EVIDENCE</text><text class="h" x="30" y="100">Source-aware snippets</text><g transform="translate(30 135)"><rect class="card" width="365" height="48"/><text class="copy" x="16" y="30">4 first-party sources</text><rect class="card" y="62" width="365" height="48"/><text class="copy" x="16" y="92">3 external signals</text><rect class="card" y="124" width="365" height="48"/><text class="copy" x="16" y="154">5 contact candidates</text></g></g>
  <text class="mono" x="90" y="850">COLLECTION ≠ SYNTHESIS / EVIDENCE REMAINS INSPECTABLE</text>
</svg>
