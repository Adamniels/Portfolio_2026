<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Structured evidence synthesis</title><desc id="desc">Ranked evidence becomes a structured company profile, outreach hooks, and contact candidates.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#176348"/></marker><style>.bg{fill:#e7e4dc}.card{fill:#f7f5ef;stroke:#aaa69b;stroke-width:2}.focus{fill:#d5e7de;stroke:#739486;stroke-width:2}.title{fill:#171715;font:600 52px Arial}.h{fill:#171715;font:600 25px Arial}.copy{fill:#5f625d;font:18px Arial}.mono{fill:#6d706b;font:17px ui-monospace,monospace;letter-spacing:2px}.num{fill:#176348;font:17px ui-monospace,monospace}.line{fill:none;stroke:#176348;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="78">ENRICHMENT / 02 SYNTHESIZE</text><text class="title" x="90" y="145">Evidence becomes reusable context.</text><text class="copy" x="90" y="185">Source priority is explicit before the model produces a structured result.</text>
  <g transform="translate(90 280)"><rect class="card" width="330" height="405"/><text class="num" x="25" y="42">01 / RANK</text><text class="h" x="25" y="92">Evidence queue</text><g transform="translate(25 125)"><rect class="focus" width="280" height="58"/><text class="copy" x="15" y="35">Company-owned fact</text><rect class="card" y="72" width="280" height="58"/><text class="copy" x="15" y="107">External recent signal</text><rect class="focus" y="144" width="280" height="58"/><text class="copy" x="15" y="179">Service capability</text><rect class="card" y="216" width="280" height="58"/><text class="copy" x="15" y="251">Contact evidence</text></g></g>
  <path class="line" d="M420 482H510"/>
  <g transform="translate(510 325)"><rect class="focus" width="350" height="315"/><text class="num" x="28" y="42">02 / SYNTHESIZE</text><text class="h" x="28" y="92">Structured model output</text><text class="copy" x="28" y="140">Facts prefer first-party evidence.</text><text class="copy" x="28" y="176">Hooks prefer current external signals.</text><text class="copy" x="28" y="212">Unknowns remain explicit.</text><rect x="28" y="252" width="294" height="35" fill="#176348"/><text x="43" y="275" fill="#f7f5ef" font-family="ui-monospace,monospace" font-size="13">HUMAN REVIEW REQUIRED</text></g>
  <path class="line" d="M860 482H950"/>
  <g transform="translate(950 255)"><rect class="card" width="560" height="475"/><text class="num" x="28" y="42">03 / REUSE</text><text class="h" x="28" y="92">Prospect intelligence</text><g transform="translate(28 125)"><rect class="focus" width="244" height="130"/><text class="num" x="18" y="30">PROFILE</text><text class="copy" x="18" y="66">What they do</text><text class="copy" x="18" y="96">Current challenges</text><rect class="focus" x="260" width="244" height="130"/><text class="num" x="278" y="30">HOOKS</text><text class="copy" x="278" y="66">Recent change</text><text class="copy" x="278" y="96">Relevant need</text><rect class="focus" y="148" width="504" height="130"/><text class="num" x="18" y="178">CONTACT CANDIDATES</text><text class="h" x="18" y="218">Maya Lind · Head of Operations</text><text class="copy" x="18" y="250">Role relevance + source confidence</text></g></g>
  <text class="mono" x="90" y="850">FRESHNESS · DEDUPLICATION · TRACEABILITY REMAIN EXTENSION POINTS</text>
</svg>
