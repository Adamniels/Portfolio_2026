<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Outreach context assembly</title><desc id="desc">Seven explicit context inputs are assembled before an outreach draft is generated.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#285bc5"/></marker><style>.bg{fill:#fcfcfd}.card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}.core{fill:#edf2fc;stroke:#91aade;stroke-width:2}.title{fill:#202630;font:600 52px Arial}.h{fill:#202630;font:600 22px Arial}.copy{fill:#626b78;font:17px Arial}.mono{fill:#626b78;font:17px 'SFMono-Regular',Consolas,monospace;letter-spacing:1px}.num{fill:#285bc5;font:16px 'SFMono-Regular',Consolas,monospace}.line{fill:none;stroke:#285bc5;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="78">GENERATION / 01 CONTEXT</text><text class="title" x="90" y="145">The message starts before the prompt.</text><text class="copy" x="90" y="185">Seven explicit inputs make personalization inspectable and configurable.</text>
  <g transform="translate(90 270)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">01 / PROSPECT</text><text class="h" x="22" y="76">Status + notes</text></g>
  <g transform="translate(90 405)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">02 / CONTACT</text><text class="h" x="22" y="76">Role + hooks</text></g>
  <g transform="translate(90 540)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">03 / RESEARCH</text><text class="h" x="22" y="76">Facts + signals</text></g>
  <g transform="translate(90 675)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">04 / USER</text><text class="h" x="22" y="76">Identity + voice</text></g>
  <g transform="translate(1230 270)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">05 / POSITIONING</text><text class="h" x="22" y="76">Services + fit</text></g>
  <g transform="translate(1230 455)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">06 / CASES</text><text class="h" x="22" y="76">Relevant work</text></g>
  <g transform="translate(1230 640)"><rect rx="6" class="card" width="280" height="110"/><text class="num" x="22" y="34">07 / PROMPT</text><text class="h" x="22" y="76">Channel rules</text></g>
  <path class="line" d="M370 325C520 325 510 440 640 440"/><path class="line" d="M370 460H640"/><path class="line" d="M370 595C520 595 510 510 640 510"/><path class="line" d="M370 730C540 730 500 560 640 540"/>
  <path class="line" d="M1230 325C1080 325 1090 440 960 440"/><path class="line" d="M1230 510H960"/><path class="line" d="M1230 695C1070 695 1100 550 960 540"/>
  <g transform="translate(640 365)"><rect rx="6" class="core" width="320" height="250"/><text class="num" x="28" y="44">CONTEXT BUILDER</text><text class="h" x="28" y="96">One structured input</text><text class="copy" x="28" y="140">Collected data strategy</text><text class="copy" x="28" y="176">or live-search strategy</text><rect x="28" y="205" width="264" height="24" fill="#285bc5"/><text x="42" y="222" fill="#ffffff" font-family="'SFMono-Regular',Consolas,monospace" font-size="12">NOT A SINGLE GENERIC PROMPT</text></g>
  <text class="mono" x="640" y="665">↓ EDITABLE EMAIL OR LINKEDIN DRAFT</text>
</svg>
