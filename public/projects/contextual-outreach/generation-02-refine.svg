<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Editable draft and conversational refinement</title><desc id="desc">A fictional outreach draft is edited directly or revised through a conversation while its research context remains attached.</desc>
  <defs><style>.bg{fill:#e7e4dc}.panel{fill:#f9f7f2;stroke:#aaa69b;stroke-width:2}.soft{fill:#eef2ef}.green{fill:#176348}.pale{fill:#d5e7de}.blue{fill:#e7eafd}.title{fill:#171715;font:600 52px Arial}.h{fill:#171715;font:600 24px Arial}.copy{fill:#565b56;font:18px Arial}.body{fill:#4e554f;font:17px Arial}.mono{fill:#6c706b;font:16px ui-monospace,monospace;letter-spacing:2px}.num{fill:#176348;font:16px ui-monospace,monospace}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="75">GENERATION / 02 REFINE</text><text class="title" x="90" y="142">Generation stays under user control.</text><text class="copy" x="90" y="182">The draft can be edited directly or revised through a focused conversation.</text>
  <g transform="translate(90 245)"><rect class="panel" width="925" height="565"/><text class="num" x="28" y="42">EMAIL / COLLECTED DATA</text><rect class="pale" x="730" y="22" width="165" height="34"/><text class="num" x="755" y="44">EDITABLE DRAFT</text><text class="mono" x="28" y="100">SUBJECT</text><text class="h" x="28" y="140">Making distributed reporting easier</text><path d="M28 165H897" stroke="#c2c7c2" stroke-width="2"/><text class="body" x="28" y="215">Hi Maya,</text><text class="body" x="28" y="260">Your Nordic expansion makes consistent reporting harder across teams.</text><text class="body" x="28" y="295">We recently helped a distributed service organization simplify a similar</text><text class="body" x="28" y="330">workflow while keeping local ownership intact.</text><rect class="pale" x="25" y="350" width="740" height="38"/><text class="body" x="34" y="375">Would a short comparison of the two approaches be useful?</text><text class="body" x="28" y="430">Best,</text><text class="body" x="28" y="462">Alex</text><path d="M28 495H897" stroke="#c2c7c2" stroke-width="2"/><text class="mono" x="28" y="530">CONTEXT USED</text><g transform="translate(190 507)"><rect class="soft" width="120" height="34"/><text class="num" x="18" y="22">RESEARCH</text><rect class="soft" x="130" width="110" height="34"/><text class="num" x="148" y="22">CONTACT</text><rect class="soft" x="250" width="150" height="34"/><text class="num" x="267" y="22">PRIOR CASE</text><rect class="soft" x="410" width="95" height="34"/><text class="num" x="430" y="22">VOICE</text></g></g>
  <g transform="translate(1045 245)"><rect class="panel" width="465" height="565"/><text class="num" x="25" y="42">CONVERSATION</text><g transform="translate(80 92)"><rect class="green" width="350" height="90"/><text x="20" y="33" fill="#f9f7f2" font-family="Arial" font-size="17">Make the opening more direct,</text><text x="20" y="61" fill="#f9f7f2" font-family="Arial" font-size="17">but keep the case reference.</text></g><g transform="translate(25 210)"><rect class="soft" width="350" height="115"/><text class="body" x="18" y="37">Opening revised.</text><text class="body" x="18" y="68">Research and case evidence retained.</text><text class="num" x="18" y="96">DRAFT UPDATED</text></g><rect x="25" y="470" width="415" height="58" fill="#f9f7f2" stroke="#aaa69b" stroke-width="2"/><text class="copy" x="45" y="505">Request another revision…</text><circle cx="411" cy="499" r="18" class="green"/><path d="M404 499h13m-6-6 6 6-6 6" stroke="#fff" stroke-width="2" fill="none"/><text class="mono" x="25" y="555">HUMAN REVIEW REQUIRED</text></g>
</svg>
