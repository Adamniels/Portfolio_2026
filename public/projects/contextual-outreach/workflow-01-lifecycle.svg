<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow validation and lifecycle</title><desc id="desc">A workflow moves from editable draft through dependency validation and timezone-aware scheduling before it can become active.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c8ff32"/></marker><style>.bg{fill:#171715}.card{fill:#252522;stroke:#55554f;stroke-width:2}.focus{fill:#2a4d40;stroke:#7da697;stroke-width:2}.bad{fill:#4a2a25;stroke:#a76b5d;stroke-width:2}.title{fill:#f0eee8;font:600 52px Arial}.h{fill:#f0eee8;font:600 24px Arial}.copy{fill:#b8b7af;font:17px Arial}.mono{fill:#8d8c84;font:16px ui-monospace,monospace;letter-spacing:2px}.num{fill:#c8ff32;font:16px ui-monospace,monospace}.line{fill:none;stroke:#c8ff32;stroke-width:3;marker-end:url(#a)}.muted{fill:none;stroke:#77776f;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="78">WORKFLOW / 01 LIFECYCLE</text><text class="title" x="90" y="145">Invalid sequences stop before activation.</text><text class="copy" x="90" y="185">Content dependencies and local schedule rules are checked before work enters the queue.</text>
  <g transform="translate(90 330)"><rect class="card" width="250" height="220"/><text class="num" x="24" y="40">01 / DRAFT</text><text class="h" x="24" y="90">Editable sequence</text><text class="copy" x="24" y="130">Email · Day 0</text><text class="copy" x="24" y="164">Wait · 2 days</text><text class="copy" x="24" y="198">LinkedIn · Day 3</text></g>
  <path class="line" d="M340 440H415"/>
  <g transform="translate(415 290)"><rect class="focus" width="300" height="300"/><text class="num" x="26" y="42">02 / VALIDATE</text><text class="h" x="26" y="92">Activation gate</text><text class="copy" x="26" y="138">✓ Generation strategy</text><text class="copy" x="26" y="174">✓ Required enrichment</text><text class="copy" x="26" y="210">✓ Ordered step content</text><text class="copy" x="26" y="246">✓ Valid state transition</text></g>
  <path class="line" d="M715 440H790"/>
  <g transform="translate(790 330)"><rect class="card" width="250" height="220"/><text class="num" x="24" y="40">03 / SCHEDULE</text><text class="h" x="24" y="90">Local → UTC</text><text class="copy" x="24" y="135">Day offset</text><text class="copy" x="24" y="169">Time of day</text><text class="copy" x="24" y="203">Selected timezone</text></g>
  <path class="line" d="M1040 440H1115"/>
  <g transform="translate(1115 330)"><rect class="focus" width="250" height="220"/><text class="num" x="24" y="40">04 / ACTIVE</text><text class="h" x="24" y="90">Due-step queue</text><text class="copy" x="24" y="135">Lease work</text><text class="copy" x="24" y="169">Record attempt</text><text class="copy" x="24" y="203">Persist result</text></g>
  <path class="line" d="M1365 440H1435"/>
  <g transform="translate(1435 355)"><rect class="card" width="100" height="170"/><text class="num" x="14" y="38">05</text><text class="h" x="14" y="80">Done</text><text class="copy" x="14" y="120">or</text><text class="copy" x="14" y="148">failed</text></g>
  <path class="muted" d="M565 590V690H790"/><g transform="translate(790 635)"><rect class="bad" width="330" height="120"/><text class="num" x="22" y="38">BLOCKED</text><text class="h" x="22" y="78">Missing data or strategy</text><text class="copy" x="22" y="105">Return to editable draft</text></g>
  <text class="mono" x="90" y="840">DRAFT → VALIDATE → SCHEDULE → EXECUTE / EVERY TRANSITION IS EXPLICIT</text>
</svg>
