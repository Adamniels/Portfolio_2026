<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow delivery boundary</title><desc id="desc">Implemented scheduling and execution call application interfaces that currently resolve to mock email and LinkedIn adapters, leaving production providers as future replacements.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#285bc5"/></marker><style>.bg{fill:#fcfcfd}.card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}.core{fill:#edf2fc;stroke:#91aade;stroke-width:2}.mock{fill:#fff6e8;stroke:#ccab70;stroke-width:2}.future{fill:#f3f5f8;stroke:#a8b4c5;stroke-width:2;stroke-dasharray:9 8}.title{fill:#202630;font:600 52px Arial}.h{fill:#202630;font:600 24px Arial}.copy{fill:#626b78;font:17px Arial}.mono{fill:#626b78;font:16px 'SFMono-Regular',Consolas,monospace;letter-spacing:1px}.num{fill:#285bc5;font:16px 'SFMono-Regular',Consolas,monospace}.amber{fill:#93621a;font:16px 'SFMono-Regular',Consolas,monospace}.line{fill:none;stroke:#285bc5;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#a8b4c5;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="mono" x="90" y="78">WORKFLOW / 02 BOUNDARY</text><text class="title" x="90" y="145">Orchestration is real; delivery is replaceable.</text><text class="copy" x="90" y="185">The prototype stops at explicit application interfaces instead of hiding an unsafe integration.</text>
  <g transform="translate(90 330)"><rect rx="6" class="core" width="310" height="260"/><text class="num" x="26" y="42">IMPLEMENTED CORE</text><text class="h" x="26" y="92">Workflow executor</text><text class="copy" x="26" y="136">Lease due step</text><text class="copy" x="26" y="171">Resolve action</text><text class="copy" x="26" y="206">Persist status + attempt</text><text class="copy" x="26" y="241">Handle failure</text></g>
  <path class="line" d="M400 460H510"/>
  <g transform="translate(510 300)"><rect rx="6" class="card" width="360" height="320"/><text class="num" x="26" y="42">APPLICATION CONTRACTS</text><g transform="translate(26 80)"><rect rx="6" class="core" width="308" height="82"/><text class="h" x="18" y="36">IEmailAction</text><text class="copy" x="18" y="63">ExecuteAsync(step)</text><rect rx="6" class="core" y="105" width="308" height="82"/><text class="h" x="18" y="141">ILinkedInAction</text><text class="copy" x="18" y="168">ExecuteAsync(step)</text></g></g>
  <path class="line" d="M870 395H990"/><path class="line" d="M870 500H990"/>
  <g transform="translate(990 270)"><rect rx="6" class="mock" width="280" height="180"/><text class="amber" x="24" y="40">CURRENT ADAPTER</text><text class="h" x="24" y="88">Mock email</text><text class="copy" x="24" y="126">Records intent</text><text class="copy" x="24" y="154">Sends nothing</text></g>
  <g transform="translate(990 485)"><rect rx="6" class="mock" width="280" height="180"/><text class="amber" x="24" y="40">CURRENT ADAPTER</text><text class="h" x="24" y="88">Mock LinkedIn</text><text class="copy" x="24" y="126">Records intent</text><text class="copy" x="24" y="154">Sends nothing</text></g>
  <path class="dash" d="M1270 360H1350"/><path class="dash" d="M1270 575H1350"/>
  <g transform="translate(1350 270)"><rect rx="6" class="future" width="180" height="180"/><text class="mono" x="18" y="40">FUTURE</text><text class="h" x="18" y="88">Approved</text><text class="h" x="18" y="118">email</text><text class="copy" x="18" y="151">provider</text></g>
  <g transform="translate(1350 485)"><rect rx="6" class="future" width="180" height="180"/><text class="mono" x="18" y="40">UNRESOLVED</text><text class="h" x="18" y="88">Approved</text><text class="h" x="18" y="118">channel</text><text class="copy" x="18" y="151">integration</text></g>
  <text class="mono" x="90" y="805">NO PRODUCTION DELIVERY CLAIM</text><rect x="90" y="825" width="1440" height="2" fill="#c6cedb"/>
</svg>
