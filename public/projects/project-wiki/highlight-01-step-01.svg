<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">Distillation step 1 — file-aware packing</title>
  <desc id="desc">Documents shown as stacks of source units are packed into batches against a token budget, with one oversized unit sub-split into three pieces that keep their parent's coordinate.</desc>
  <defs>
    <style>
      .bg{fill:#fcfcfd}
      .ink{fill:#202630}
      .copy{fill:#626b78}
      .muted{fill:#626b78}
      .accent{fill:#285bc5}
      .neg{fill:#b6423a}
      .card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}
      .hi{fill:#edf2fc;stroke:#91aade;stroke-width:2}
      .over{fill:#ffffff;stroke:#b6423a;stroke-width:2}
      .rule{fill:none;stroke:#c6cedb;stroke-width:1}
      .mono{font-family:'SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
      .flow{fill:none;stroke:#285bc5;stroke-width:2;marker-end:url(#ar)}
      .split{fill:none;stroke:#b6423a;stroke-width:2;marker-end:url(#an)}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
    <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b6423a"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="lbl muted" x="80" y="78" font-size="15">DISTILLATION PIPELINE · 1 OF 3</text>
  <text class="lbl accent" x="1520" y="78" font-size="15" text-anchor="end">01 / PACKING</text>
  <path class="rule" d="M80 100H1520"/>

  <text class="ink" x="78" y="186" font-size="58" font-weight="600">Whole files, up to a budget.</text>
  <text class="copy" x="80" y="228" font-size="20">A document's units are kept together so the model distils a symbol with its local context, never in isolation.</text>

  <text class="lbl accent" x="80" y="300" font-size="13">01 / FILE GROUPS</text>
  <text class="lbl accent" x="480" y="300" font-size="13">02 / PACKING RULE</text>
  <text class="lbl accent" x="870" y="300" font-size="13">03 / BATCHES</text>
  <path class="rule" d="M80 316H420"/>
  <path class="rule" d="M480 316H810"/>
  <path class="rule" d="M870 316H1520"/>

  <!-- file groups -->
  <text class="ink" x="80" y="362" font-size="19" font-weight="600">document A</text>
  <rect class="card" x="80" y="376" width="180" height="28"/>
  <rect class="card" x="80" y="410" width="180" height="28"/>
  <rect class="card" x="80" y="444" width="180" height="28"/>
  <rect class="card" x="80" y="478" width="180" height="28"/>
  <text class="mono copy" x="276" y="446" font-size="13">4 units</text>

  <text class="ink" x="80" y="548" font-size="19" font-weight="600">document B</text>
  <rect class="card" x="80" y="562" width="180" height="28"/>
  <rect class="card" x="80" y="596" width="180" height="28"/>
  <rect class="card" x="80" y="630" width="180" height="28"/>
  <text class="mono copy" x="276" y="614" font-size="13">3 units</text>

  <text class="ink" x="80" y="700" font-size="19" font-weight="600">document C</text>
  <rect rx="6" class="over" x="80" y="714" width="180" height="100"/>
  <text class="mono neg" x="80" y="842" font-size="13">1 unit, over budget</text>
  <text class="mono neg" x="80" y="864" font-size="13">— sub-split</text>

  <path class="flow" d="M420 410H476"/>

  <!-- packing rule -->
  <rect rx="6" class="hi" x="480" y="350" width="330" height="120"/>
  <text class="ink" x="500" y="388" font-size="20" font-weight="600">SizeBudget</text>
  <text class="mono accent" x="500" y="416" font-size="13">a TokenCounter behind a</text>
  <text class="mono accent" x="500" y="438" font-size="13">SizeBudget port</text>
  <text class="mono accent" x="500" y="460" font-size="13">budget = 10 000 tokens</text>

  <text class="copy" x="480" y="516" font-size="15">1 — Whole files' units are packed</text>
  <text class="copy" x="480" y="538" font-size="15">together until the budget, then a</text>
  <text class="copy" x="480" y="560" font-size="15">new batch starts.</text>

  <text class="copy" x="480" y="608" font-size="15">2 — A file that alone exceeds the</text>
  <text class="copy" x="480" y="630" font-size="15">budget is split across batches.</text>

  <text class="copy" x="480" y="678" font-size="15">3 — A single unit over the budget</text>
  <text class="copy" x="480" y="700" font-size="15">is sub-split on line boundaries.</text>

  <text class="copy" x="480" y="748" font-size="15">4 — Ordinals are assigned in packing</text>
  <text class="copy" x="480" y="770" font-size="15">order, stable across re-runs.</text>

  <path class="flow" d="M810 410H866"/>

  <!-- batches -->
  <rect rx="6" class="hi" x="870" y="350" width="650" height="160"/>
  <text class="lbl accent" x="890" y="384" font-size="13">ORDINAL 0</text>
  <text class="ink" x="890" y="422" font-size="22" font-weight="600">document A + document B</text>
  <text class="mono accent" x="890" y="454" font-size="13">7 units · one model call · one transaction</text>
  <text class="mono accent" x="890" y="478" font-size="13">both files fit the budget, so they pack together</text>

  <text class="lbl muted" x="870" y="556" font-size="13">DOCUMENT C — ONE OVERSIZED UNIT, SUB-SPLIT</text>
  <path class="rule" d="M870 572H1520"/>

  <rect rx="6" class="card" x="870" y="592" width="200" height="112"/>
  <text class="lbl accent" x="890" y="624" font-size="12">ORDINAL 1</text>
  <text class="ink" x="890" y="656" font-size="17" font-weight="600">piece 1 of 3</text>
  <text class="mono copy" x="890" y="682" font-size="12">parent coordinate</text>

  <rect rx="6" class="card" x="1095" y="592" width="200" height="112"/>
  <text class="lbl accent" x="1115" y="624" font-size="12">ORDINAL 2</text>
  <text class="ink" x="1115" y="656" font-size="17" font-weight="600">piece 2 of 3</text>
  <text class="mono copy" x="1115" y="682" font-size="12">parent coordinate</text>

  <rect rx="6" class="card" x="1320" y="592" width="200" height="112"/>
  <text class="lbl accent" x="1340" y="624" font-size="12">ORDINAL 3</text>
  <text class="ink" x="1340" y="656" font-size="17" font-weight="600">piece 3 of 3</text>
  <text class="mono copy" x="1340" y="682" font-size="12">parent coordinate</text>

  <path class="split" d="M970 572V588"/>
  <path class="split" d="M1195 572V588"/>
  <path class="split" d="M1420 572V588"/>

  <text class="copy" x="870" y="822" font-size="15">Every piece keeps the parent unit's coordinate, so provenance still resolves</text>
  <text class="copy" x="870" y="844" font-size="15">to the one symbol — which is why a batch is keyed by its ordinal, never by the</text>
  <text class="copy" x="870" y="866" font-size="15">coordinates it covers.</text>

  <path class="rule" d="M80 900H1520"/>
  <text class="lbl accent" x="80" y="934" font-size="13">BEFORE A PENNY IS SPENT</text>
  <text class="copy" x="380" y="935" font-size="15">Every planned batch is logged with its unit count, its character count, and its measured size in the budget's own unit.</text>
</svg>
