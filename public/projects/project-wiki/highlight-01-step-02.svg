<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">Distillation step 2 — the per-batch commit loop</title>
  <desc id="desc">Three batches run in sequence: batch 0 commits, batch 1 fails as truncated and is recorded and skipped, batch 2 commits, and the run reports two done and one failed with the retry command.</desc>
  <defs>
    <style>
      .bg{fill:#fcfcfd}
      .ink{fill:#202630}
      .copy{fill:#626b78}
      .muted{fill:#626b78}
      .accent{fill:#285bc5}
      .neg{fill:#b6423a}
      .card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}
      .hi{fill:#edf2fc;stroke:#91aade;stroke-width:2}
      .over{fill:#ffffff;stroke:#b6423a;stroke-width:2}
      .rule{fill:none;stroke:#c6cedb;stroke-width:1}
      .mono{font-family:'SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
      .flow{fill:none;stroke:#285bc5;stroke-width:2;marker-end:url(#ar)}
      .flowneg{fill:none;stroke:#b6423a;stroke-width:2;marker-end:url(#an)}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
    <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b6423a"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="lbl muted" x="80" y="78" font-size="15">DISTILLATION PIPELINE · 2 OF 3</text>
  <text class="lbl accent" x="1520" y="78" font-size="15" text-anchor="end">02 / COMMIT LOOP</text>
  <path class="rule" d="M80 100H1520"/>

  <text class="ink" x="78" y="186" font-size="58" font-weight="600">One batch, one transaction.</text>
  <text class="copy" x="80" y="228" font-size="20">The walker holds no session. Each batch goes to a processor that runs it, records the outcome, and commits — so a failure stays local.</text>

  <text class="lbl muted" x="80" y="292" font-size="12">BATCH</text>
  <text class="lbl muted" x="256" y="292" font-size="12">MODEL CALL</text>
  <text class="lbl muted" x="512" y="292" font-size="12">OUTCOME</text>
  <text class="lbl muted" x="778" y="292" font-size="12">TRANSACTION</text>
  <text class="lbl accent" x="1010" y="292" font-size="12">DISTILLATION_BATCH — ONE ROW PER BATCH</text>
  <path class="rule" d="M80 308H950"/>
  <path class="rule" d="M1010 308H1520"/>

  <!-- lane 0 -->
  <rect rx="6" class="card" x="80" y="336" width="140" height="104"/>
  <text class="ink" x="100" y="376" font-size="20" font-weight="600">batch 0</text>
  <text class="mono copy" x="100" y="404" font-size="12">ordinal 0</text>
  <path class="flow" d="M220 388H252"/>
  <rect rx="6" class="card" x="256" y="336" width="220" height="104"/>
  <text class="ink" x="276" y="376" font-size="17" font-weight="600">one model call</text>
  <text class="mono copy" x="276" y="404" font-size="12">stop_reason = end_turn</text>
  <path class="flow" d="M476 388H508"/>
  <rect rx="6" class="hi" x="512" y="336" width="230" height="104"/>
  <text class="mono accent" x="532" y="376" font-size="14">status = done</text>
  <text class="mono accent" x="532" y="404" font-size="12">nodes, merges, edges written</text>
  <path class="flow" d="M742 388H774"/>
  <rect rx="6" class="hi" x="778" y="336" width="172" height="104"/>
  <text class="lbl accent" x="798" y="376" font-size="13">COMMIT</text>
  <text class="mono accent" x="798" y="404" font-size="12">durable</text>

  <path class="flow" d="M150 440V462"/>

  <!-- lane 1 -->
  <rect rx="6" class="card" x="80" y="466" width="140" height="104"/>
  <text class="ink" x="100" y="506" font-size="20" font-weight="600">batch 1</text>
  <text class="mono copy" x="100" y="534" font-size="12">ordinal 1</text>
  <path class="flowneg" d="M220 518H252"/>
  <rect rx="6" class="over" x="256" y="466" width="220" height="104"/>
  <text class="ink" x="276" y="506" font-size="17" font-weight="600">reply cut off</text>
  <text class="mono neg" x="276" y="534" font-size="12">stop_reason = max_tokens</text>
  <path class="flowneg" d="M476 518H508"/>
  <rect rx="6" class="over" x="512" y="466" width="230" height="104"/>
  <text class="mono neg" x="532" y="500" font-size="14">status = failed</text>
  <text class="mono neg" x="532" y="524" font-size="12">failure_kind = truncated</text>
  <text class="mono neg" x="532" y="548" font-size="12">attempts = 1</text>
  <path class="flowneg" d="M742 518H774"/>
  <rect rx="6" class="over" x="778" y="466" width="172" height="104"/>
  <text class="lbl neg" x="798" y="500" font-size="12">ROLL BACK</text>
  <text class="lbl neg" x="798" y="524" font-size="12">RECORD, COMMIT</text>
  <text class="mono neg" x="798" y="550" font-size="12">skipped</text>

  <path class="flow" d="M150 570V592"/>
  <text class="mono accent" x="170" y="588" font-size="12">the run continues</text>

  <!-- lane 2 -->
  <rect rx="6" class="card" x="80" y="596" width="140" height="104"/>
  <text class="ink" x="100" y="636" font-size="20" font-weight="600">batch 2</text>
  <text class="mono copy" x="100" y="664" font-size="12">ordinal 2</text>
  <path class="flow" d="M220 648H252"/>
  <rect rx="6" class="card" x="256" y="596" width="220" height="104"/>
  <text class="ink" x="276" y="636" font-size="17" font-weight="600">one model call</text>
  <text class="mono copy" x="276" y="664" font-size="12">stop_reason = end_turn</text>
  <path class="flow" d="M476 648H508"/>
  <rect rx="6" class="hi" x="512" y="596" width="230" height="104"/>
  <text class="mono accent" x="532" y="636" font-size="14">status = done</text>
  <text class="mono accent" x="532" y="664" font-size="12">nodes, merges, edges written</text>
  <path class="flow" d="M742 648H774"/>
  <rect rx="6" class="hi" x="778" y="596" width="172" height="104"/>
  <text class="lbl accent" x="798" y="636" font-size="13">COMMIT</text>
  <text class="mono accent" x="798" y="664" font-size="12">durable</text>

  <!-- the table -->
  <text class="lbl muted" x="1030" y="352" font-size="12">ORDINAL</text>
  <text class="lbl muted" x="1160" y="352" font-size="12">STATUS</text>
  <text class="lbl muted" x="1290" y="352" font-size="12">FAILURE_KIND</text>
  <text class="lbl muted" x="1500" y="352" font-size="12" text-anchor="end">ATTEMPTS</text>
  <path class="rule" d="M1010 366H1520"/>

  <rect rx="6" class="hi" x="1010" y="378" width="510" height="52"/>
  <text class="mono ink" x="1030" y="410" font-size="15">0</text>
  <text class="mono accent" x="1160" y="410" font-size="15">done</text>
  <text class="mono copy" x="1290" y="410" font-size="15">—</text>
  <text class="mono ink" x="1500" y="410" font-size="15" text-anchor="end">1</text>

  <rect rx="6" class="over" x="1010" y="440" width="510" height="52"/>
  <text class="mono ink" x="1030" y="472" font-size="15">1</text>
  <text class="mono neg" x="1160" y="472" font-size="15">failed</text>
  <text class="mono neg" x="1290" y="472" font-size="15">truncated</text>
  <text class="mono ink" x="1500" y="472" font-size="15" text-anchor="end">1</text>

  <rect rx="6" class="hi" x="1010" y="502" width="510" height="52"/>
  <text class="mono ink" x="1030" y="534" font-size="15">2</text>
  <text class="mono accent" x="1160" y="534" font-size="15">done</text>
  <text class="mono copy" x="1290" y="534" font-size="15">—</text>
  <text class="mono ink" x="1500" y="534" font-size="15" text-anchor="end">1</text>

  <text class="copy" x="1010" y="596" font-size="14">Also stored: id, project_id, source_id, locators,</text>
  <text class="copy" x="1010" y="618" font-size="14">failure_detail, created_at, updated_at.</text>
  <text class="copy" x="1010" y="654" font-size="14">Unique on (source_id, ordinal), so a re-run's</text>
  <text class="copy" x="1010" y="676" font-size="14">batch is tied to its prior record and a batch</text>
  <text class="copy" x="1010" y="698" font-size="14">already marked done is skipped, not redone.</text>

  <!-- what the run reports -->
  <path class="rule" d="M80 756H1520"/>
  <text class="lbl accent" x="80" y="792" font-size="13">WHAT THE RUN REPORTS</text>
  <rect rx="6" class="card" x="80" y="816" width="1440" height="132"/>
  <text class="mono ink" x="112" y="866" font-size="18">batches 2 done, 0 skipped, 1 failed</text>
  <text class="mono accent" x="112" y="906" font-size="18">run `pw distill-retry &lt;project&gt;` to re-attempt failed batches</text>
  <text class="mono muted" x="1488" y="866" font-size="13" text-anchor="end">truncation is read from the model's stop reason,</text>
  <text class="mono muted" x="1488" y="890" font-size="13" text-anchor="end">never guessed from a parse error</text>
</svg>
