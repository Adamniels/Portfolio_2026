<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">Distillation step 3 — the retry policy</title>
  <desc id="desc">Retry forks on the recorded failure kind: a truncated batch is re-planned into smaller sub-batches with a halved budget, a transient failure backs off and retries as-is, and invalid JSON is retried once and then left failed.</desc>
  <defs>
    <style>
      .bg{fill:#fcfcfd}
      .ink{fill:#202630}
      .copy{fill:#626b78}
      .muted{fill:#626b78}
      .accent{fill:#285bc5}
      .neg{fill:#b6423a}
      .card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}
      .hi{fill:#edf2fc;stroke:#91aade;stroke-width:2}
      .over{fill:#ffffff;stroke:#b6423a;stroke-width:2}
      .rule{fill:none;stroke:#c6cedb;stroke-width:1}
      .fork{fill:none;stroke:#285bc5;stroke-width:2}
      .mono{font-family:'SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
      .flow{fill:none;stroke:#285bc5;stroke-width:2;marker-end:url(#ar)}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="lbl muted" x="80" y="78" font-size="15">DISTILLATION PIPELINE · 3 OF 3</text>
  <text class="lbl accent" x="1520" y="78" font-size="15" text-anchor="end">03 / RETRY POLICY</text>
  <path class="rule" d="M80 100H1520"/>

  <text class="ink" x="78" y="186" font-size="58" font-weight="600">The recovery depends on the failure.</text>
  <text class="copy" x="80" y="228" font-size="20">Retrying a truncated batch identically would truncate identically. The policy is chosen from the failure kind the run recorded.</text>

  <!-- entry chain -->
  <rect rx="6" class="card" x="80" y="286" width="380" height="96"/>
  <text class="lbl accent" x="100" y="318" font-size="12">COMMAND</text>
  <text class="mono ink" x="100" y="356" font-size="18">pw distill-retry &lt;project&gt;</text>

  <path class="flow" d="M460 334H496"/>

  <rect rx="6" class="card" x="500" y="286" width="440" height="96"/>
  <text class="lbl accent" x="520" y="318" font-size="12">RE-PLAN THE SOURCE</text>
  <text class="ink" x="520" y="350" font-size="19" font-weight="600">pinned to the watermark, not HEAD</text>
  <text class="mono copy" x="520" y="372" font-size="12">a source that moved would re-plan to different batches</text>

  <path class="flow" d="M940 334H976"/>

  <rect rx="6" class="card" x="980" y="286" width="540" height="96"/>
  <text class="lbl accent" x="1000" y="318" font-size="12">FIND THE FAILED BATCH</text>
  <text class="ink" x="1000" y="350" font-size="19" font-weight="600">by its ordinal — the planner is deterministic</text>
  <text class="mono copy" x="1000" y="372" font-size="12">a coordinate cannot name a batch: sub-split pieces share one</text>

  <!-- fork -->
  <text class="lbl accent" x="80" y="410" font-size="13">FORK ON THE RECORDED FAILURE KIND</text>
  <path class="fork" d="M1250 382V424"/>
  <path class="fork" d="M310 424H1290"/>
  <path class="flow" d="M310 424V462"/>
  <path class="flow" d="M800 424V462"/>
  <path class="flow" d="M1290 424V462"/>

  <!-- branch A -->
  <rect rx="6" class="over" x="80" y="470" width="460" height="64"/>
  <text class="mono neg" x="100" y="510" font-size="18">failure_kind = truncated</text>
  <rect rx="6" class="hi" x="80" y="550" width="460" height="234"/>
  <text class="lbl accent" x="100" y="586" font-size="13">POLICY = SPLIT</text>
  <text class="ink" x="100" y="626" font-size="24" font-weight="600">Re-plan it smaller</text>
  <text class="mono accent" x="100" y="662" font-size="14">budget.scaled(2 ** attempts)</text>
  <text class="mono accent" x="100" y="686" font-size="14">— halved for each prior attempt</text>
  <text class="mono accent" x="100" y="722" font-size="14">the batch's own units are re-packed</text>
  <text class="mono accent" x="100" y="746" font-size="14">into several smaller sub-batches,</text>
  <text class="mono accent" x="100" y="770" font-size="14">all under the original record</text>

  <!-- branch B -->
  <rect rx="6" class="card" x="570" y="470" width="460" height="64"/>
  <text class="mono ink" x="590" y="510" font-size="17">failure_kind = rate_limited / other</text>
  <rect rx="6" class="hi" x="570" y="550" width="460" height="234"/>
  <text class="lbl accent" x="590" y="586" font-size="13">POLICY = BACKOFF</text>
  <text class="ink" x="590" y="626" font-size="24" font-weight="600">Wait, then retry as-is</text>
  <text class="mono accent" x="590" y="662" font-size="14">sleep 2.0 s × 2 ^ (attempts − 1)</text>
  <text class="mono accent" x="590" y="686" font-size="14">through an injected sleep, so a</text>
  <text class="mono accent" x="590" y="710" font-size="14">test asserts backoff without waiting</text>
  <text class="mono accent" x="590" y="746" font-size="14">the batch is re-distilled unchanged:</text>
  <text class="mono accent" x="590" y="770" font-size="14">nothing about it was wrong</text>

  <!-- branch C -->
  <rect rx="6" class="over" x="1060" y="470" width="460" height="64"/>
  <text class="mono neg" x="1080" y="510" font-size="18">failure_kind = invalid_json</text>
  <rect rx="6" class="card" x="1060" y="550" width="460" height="234"/>
  <text class="lbl accent" x="1080" y="586" font-size="13">POLICY = ONE_SHOT</text>
  <text class="ink" x="1080" y="626" font-size="24" font-weight="600">Retry once, then stop</text>
  <text class="mono copy" x="1080" y="662" font-size="14">capped at 2 attempts — the init call</text>
  <text class="mono copy" x="1080" y="686" font-size="14">plus a single retry</text>
  <text class="mono neg" x="1080" y="722" font-size="14">still unparseable → the batch stays</text>
  <text class="mono neg" x="1080" y="746" font-size="14">visibly failed, with its</text>
  <text class="mono neg" x="1080" y="770" font-size="14">failure_detail preserved</text>

  <!-- the cap -->
  <path class="rule" d="M80 830H1520"/>
  <text class="lbl accent" x="80" y="866" font-size="13">THE CAP</text>
  <text class="copy" x="80" y="900" font-size="16">Attempts are capped at three, so retry cannot loop forever. A batch past its cap is reported as exhausted and left visibly failed for the curator</text>
  <text class="copy" x="80" y="926" font-size="16">to inspect. If the ordinal is no longer in the source's plan, the batch that failed no longer exists to re-attempt, and the run says so.</text>
</svg>
