<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">A merged pull request through the maintenance loop</title>
  <desc id="desc">A merged pull request drives a git diff that selects touched documents for re-ingestion, provenance selects the concepts pinned to those coordinates, and each concept is corrected, proposed for deprecation, or queued for the curator.</desc>
  <defs>
    <style>
      .bg{fill:#E7E4DC}
      .ink{fill:#171715}
      .copy{fill:#5F625D}
      .muted{fill:#8A867C}
      .accent{fill:#176348}
      .neg{fill:#B24A2E}
      .card{fill:#F7F5EF;stroke:#AAA69B;stroke-width:2}
      .hi{fill:#D5E7DE;stroke:#739486;stroke-width:2}
      .rule{fill:none;stroke:#AAA69B;stroke-width:1}
      .fork{fill:none;stroke:#176348;stroke-width:2}
      .mono{font-family:'DM Mono','SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'DM Mono','SFMono-Regular',Menlo,monospace;letter-spacing:2px}
      .flow{fill:none;stroke:#176348;stroke-width:2;marker-end:url(#ar)}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#176348"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1100"/>

  <text class="lbl muted" x="80" y="78" font-size="15">PROVENANCE · INCREMENTAL MAINTENANCE</text>
  <text class="lbl accent" x="1520" y="78" font-size="15" text-anchor="end">A MERGED PULL REQUEST</text>
  <path class="rule" d="M80 100H1520"/>

  <text class="ink" x="78" y="186" font-size="58" font-weight="600">What the diff touched, and only that.</text>
  <text class="copy" x="80" y="228" font-size="20">A change can only ever cost knowledge the system can prove is gone. Everything else is repaired, proposed, or handed to a human.</text>

  <path class="rule" d="M80 268H1520"/>

  <!-- the chain -->
  <rect class="card" x="80" y="300" width="324" height="160"/>
  <text class="lbl accent" x="100" y="332" font-size="12">01 / TRIGGER</text>
  <text class="ink" x="100" y="368" font-size="19" font-weight="600">Merged pull request</text>
  <text class="mono copy" x="100" y="398" font-size="12">a webhook records the change and</text>
  <text class="mono copy" x="100" y="420" font-size="12">returns; a background task runs it</text>
  <text class="mono copy" x="100" y="442" font-size="12">kind = pr_merged</text>

  <path class="flow" d="M404 380H448"/>

  <rect class="card" x="452" y="300" width="324" height="160"/>
  <text class="lbl accent" x="472" y="332" font-size="12">02 / DETECT</text>
  <text class="ink" x="472" y="368" font-size="19" font-weight="600">git diff</text>
  <text class="mono copy" x="472" y="398" font-size="12">the source is refreshed and diffed</text>
  <text class="mono copy" x="472" y="420" font-size="12">from its own watermark</text>
  <text class="mono copy" x="472" y="442" font-size="12">the payload is never consulted</text>

  <path class="flow" d="M776 380H820"/>

  <rect class="card" x="824" y="300" width="324" height="160"/>
  <text class="lbl accent" x="844" y="332" font-size="12">03 / RE-INGEST</text>
  <text class="ink" x="844" y="368" font-size="19" font-weight="600">Only touched documents</text>
  <text class="mono copy" x="844" y="398" font-size="12">added · modified · removed · renamed</text>
  <text class="mono copy" x="844" y="420" font-size="12">re-ingested and re-indexed;</text>
  <text class="mono copy" x="844" y="442" font-size="12">a rename is a move, not a loss</text>

  <path class="flow" d="M1148 380H1192"/>

  <rect class="hi" x="1196" y="300" width="324" height="160"/>
  <text class="lbl accent" x="1216" y="332" font-size="12">04 / SELECT</text>
  <text class="ink" x="1216" y="368" font-size="19" font-weight="600">Provenance picks</text>
  <text class="mono accent" x="1216" y="398" font-size="12">the concepts whose links pin</text>
  <text class="mono accent" x="1216" y="420" font-size="12">those coordinates, re-distilled</text>
  <text class="mono accent" x="1216" y="442" font-size="12">through the same batch path</text>

  <!-- routing bar -->
  <rect class="hi" x="80" y="506" width="1440" height="76"/>
  <text class="lbl accent" x="104" y="534" font-size="13">05 / ROUTE EACH CONCEPT</text>
  <text class="mono accent" x="104" y="562" font-size="14">judged against the new text of the document it came from — never against the source ref</text>
  <text class="mono accent" x="1496" y="562" font-size="13" text-anchor="end">everything queues; nothing here writes</text>

  <path class="fork" d="M800 582V600"/>
  <path class="fork" d="M310 600H1290"/>
  <path class="flow" d="M310 600V624"/>
  <path class="flow" d="M800 600V624"/>
  <path class="flow" d="M1290 600V624"/>

  <!-- outcomes -->
  <rect class="hi" x="80" y="628" width="460" height="214"/>
  <text class="lbl accent" x="100" y="664" font-size="13">CORRECTED</text>
  <text class="ink" x="100" y="706" font-size="24" font-weight="600">The text contradicts it</text>
  <text class="mono accent" x="100" y="742" font-size="14">queued as an update to the node,</text>
  <text class="mono accent" x="100" y="766" font-size="14">quoting the document's new sentence</text>
  <text class="mono accent" x="100" y="800" font-size="14">a rule whose number moved is</text>
  <text class="mono accent" x="100" y="824" font-size="14">repaired, not thrown away</text>

  <rect class="card" x="570" y="628" width="460" height="214"/>
  <text class="lbl muted" x="590" y="664" font-size="13">PROPOSED FOR DEPRECATION</text>
  <text class="ink" x="590" y="706" font-size="24" font-weight="600">No live evidence left</text>
  <text class="mono copy" x="590" y="742" font-size="14">its provenance was retired because</text>
  <text class="mono copy" x="590" y="766" font-size="14">the content is provably gone</text>
  <text class="mono copy" x="590" y="800" font-size="14">proposed, never applied — and</text>
  <text class="mono copy" x="590" y="824" font-size="14">nothing is ever hard deleted</text>

  <rect class="card" x="1060" y="628" width="460" height="214"/>
  <text class="lbl muted" x="1080" y="664" font-size="13">QUEUED FOR THE CURATOR</text>
  <text class="ink" x="1080" y="706" font-size="24" font-weight="600">Contested</text>
  <text class="mono copy" x="1080" y="742" font-size="14">a contradiction, a duplicate, or a</text>
  <text class="mono copy" x="1080" y="766" font-size="14">verdict under its own confidence floor</text>
  <text class="mono copy" x="1080" y="800" font-size="14">every queue item carries the merged</text>
  <text class="mono copy" x="1080" y="824" font-size="14">change that caused it</text>

  <!-- worked case -->
  <path class="rule" d="M80 868H1520"/>
  <text class="lbl accent" x="80" y="900" font-size="13">THE WORKED CASE — A RETENTION PERIOD THAT MOVED</text>

  <rect class="card" x="80" y="918" width="1440" height="110"/>
  <text class="lbl muted" x="104" y="948" font-size="12">THE CONCEPT ASSERTED</text>
  <text class="mono ink" x="104" y="982" font-size="16">“Serum is retained for 30 calendar days…”</text>
  <text class="mono accent" x="104" y="1008" font-size="12">material class retention minimums</text>

  <path class="flow" d="M620 976H676"/>

  <text class="lbl muted" x="700" y="948" font-size="12">THE SOURCE NOW SAYS</text>
  <text class="mono ink" x="700" y="982" font-size="16">“Serum is retained for 45 calendar days…”</text>
  <text class="mono accent" x="700" y="1008" font-size="12">the retention document, after the merge</text>

  <text class="lbl accent" x="1496" y="948" font-size="12" text-anchor="end">OUTCOME</text>
  <text class="mono ink" x="1496" y="982" font-size="16" text-anchor="end">corrected, not retired</text>
  <text class="mono muted" x="1496" y="1008" font-size="12" text-anchor="end">deprecation would discard a true rule</text>

  <text class="copy" x="80" y="1062" font-size="15">Silence is never a verdict: a source that merely stops mentioning a concept triggers nothing.</text>
  <text class="copy" x="80" y="1086" font-size="15">And identity, not the coordinate, answers whether content is gone — a line range has none, so line-anchored evidence is never retired.</text>
</svg>
