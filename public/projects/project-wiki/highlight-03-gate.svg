<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">The build gate</title>
  <desc id="desc">The single build command runs six stages from formatting to the frontend build, with the four documentation-honesty guards inside the test stage and a callout describing the browser-init failure a green gate once hid.</desc>
  <defs>
    <style>
      .bg{fill:#fcfcfd}
      .fg{fill:#202630}
      .muted{fill:#626b78}
      .accent{fill:#285bc5}
      .neg{fill:#b6423a}
      .box{fill:none;stroke:#c6cedb;stroke-width:1}
      .boxa{fill:none;stroke:#285bc5;stroke-width:1.5}
      .boxn{fill:none;stroke:#b6423a;stroke-width:1.5}
      .line{fill:none;stroke:#c6cedb;stroke-width:1}
      .mono{font-family:'SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
      .flow{fill:none;stroke:#285bc5;stroke-width:1.5;marker-end:url(#ag)}
      .tap{fill:none;stroke:#285bc5;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#ag)}
    
      rect.nbox, rect.box { fill: #ffffff; }
      rect.nboxg, rect.boxa { fill: #edf2fc; }
      rect.nboxc, rect.boxn { fill: #fcf0ee; }
    </style>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="lbl muted" x="80" y="78" font-size="15">ARCHITECTURE · VERIFICATION DISCIPLINE</text>
  <text class="lbl accent" x="1520" y="78" font-size="15" text-anchor="end">MAKE CHECK</text>
  <path class="line" d="M80 100H1520"/>

  <text class="fg" x="78" y="186" font-size="58" font-weight="600">One command, and it tells the truth.</text>
  <text class="muted" x="80" y="228" font-size="20">Every claim the project makes about itself is a test that runs in the ordinary build — written after a case where a green build lied.</text>

  <!-- pipeline -->
  <rect rx="6" class="box" x="80" y="300" width="220" height="150"/>
  <text class="lbl accent" x="100" y="330" font-size="12">01</text>
  <text class="fg" x="100" y="364" font-size="21" font-weight="600">fmt-check</text>
  <text class="mono muted" x="100" y="396" font-size="11">ruff format --check .</text>

  <path class="flow" d="M300 375H320"/>

  <rect rx="6" class="box" x="324" y="300" width="220" height="150"/>
  <text class="lbl accent" x="344" y="330" font-size="12">02</text>
  <text class="fg" x="344" y="364" font-size="21" font-weight="600">lint</text>
  <text class="mono muted" x="344" y="396" font-size="11">ruff check .</text>

  <path class="flow" d="M544 375H564"/>

  <rect rx="6" class="box" x="568" y="300" width="220" height="150"/>
  <text class="lbl accent" x="588" y="330" font-size="12">03</text>
  <text class="fg" x="588" y="364" font-size="21" font-weight="600">typecheck</text>
  <text class="mono muted" x="588" y="396" font-size="11">pyright, strict mode</text>
  <text class="mono muted" x="588" y="416" font-size="11">version pinned</text>

  <path class="flow" d="M788 375H808"/>

  <rect rx="6" class="box" x="812" y="300" width="220" height="150"/>
  <text class="lbl accent" x="832" y="330" font-size="12">04</text>
  <text class="fg" x="832" y="364" font-size="21" font-weight="600">imports</text>
  <text class="mono muted" x="832" y="396" font-size="11">lint-imports</text>
  <text class="mono muted" x="832" y="416" font-size="11">hexagonal layers, plus</text>
  <text class="mono muted" x="832" y="436" font-size="11">15 forbidden modules</text>

  <path class="flow" d="M1032 375H1052"/>

  <rect rx="6" class="boxa" x="1056" y="300" width="220" height="150"/>
  <text class="lbl accent" x="1076" y="330" font-size="12">05</text>
  <text class="fg" x="1076" y="364" font-size="21" font-weight="600">test</text>
  <text class="mono muted" x="1076" y="396" font-size="11">pytest, ~775 tests</text>
  <text class="mono muted" x="1076" y="416" font-size="11">verification-map.json</text>
  <text class="mono accent" x="1076" y="436" font-size="11">68 of 69 verified</text>

  <path class="flow" d="M1276 375H1296"/>

  <rect rx="6" class="box" x="1300" y="300" width="220" height="150"/>
  <text class="lbl accent" x="1320" y="330" font-size="12">06</text>
  <text class="fg" x="1320" y="364" font-size="21" font-weight="600">web-check</text>
  <text class="mono muted" x="1320" y="396" font-size="11">tsc --noEmit</text>
  <text class="mono muted" x="1320" y="416" font-size="11">vitest, 127 tests</text>
  <text class="mono muted" x="1320" y="436" font-size="11">vite build</text>

  <path class="tap" d="M1100 450V490H420V522"/>

  <!-- callout 1 -->
  <rect rx="6" class="boxa" x="80" y="530" width="700" height="340"/>
  <text class="lbl accent" x="104" y="568" font-size="13">INSIDE STAGE 05 — FOUR DOCUMENTATION-HONESTY GUARDS</text>
  <path class="line" d="M104 584H756"/>

  <text class="fg" x="104" y="622" font-size="17">Migration head still matches the ORM metadata</text>
  <text class="mono muted" x="104" y="644" font-size="12">a model changed without a migration fails the build</text>

  <text class="fg" x="104" y="684" font-size="17">.env.example documents every settings field</text>
  <text class="mono muted" x="104" y="706" font-size="12">and the other direction too: it invents nothing</text>

  <text class="fg" x="104" y="746" font-size="17">The generated agent context matches its source</text>
  <text class="mono muted" x="104" y="768" font-size="12">AGENTS.md must be what its generator would write</text>

  <text class="fg" x="104" y="808" font-size="17">Every internal doc link and repository path resolves</text>
  <text class="mono muted" x="104" y="830" font-size="12">a pointer that leads nowhere is followed, and then trusted</text>

  <!-- callout 2 -->
  <rect rx="6" class="boxn" x="820" y="530" width="700" height="340"/>
  <text class="lbl neg" x="844" y="568" font-size="13">THE LESSON — A GREEN GATE THAT LIED</text>
  <path class="line" d="M844 584H1496"/>

  <text class="fg" x="844" y="620" font-size="20" font-weight="600">Browser-driven init had never worked.</text>
  <text class="mono muted" x="844" y="650" font-size="12">the endpoint flushed, and the commit lived in the dependency</text>
  <text class="mono muted" x="844" y="672" font-size="12">teardown — which runs after the background task starts, so the</text>
  <text class="mono muted" x="844" y="694" font-size="12">task opened its own session and could not see the row</text>

  <text class="fg" x="844" y="736" font-size="20" font-weight="600">Its test passed for months.</text>
  <text class="mono muted" x="844" y="766" font-size="12">the stand-in task appended the run id to a list and never</text>
  <text class="mono muted" x="844" y="788" font-size="12">touched the database. Seeing the object is free; seeing the</text>
  <text class="mono muted" x="844" y="810" font-size="12">row is the whole question, and only a second session answers it</text>

  <text class="lbl accent" x="844" y="848" font-size="12">FIXED — COMMIT BEFORE SCHEDULING, AT ALL FIVE SITES</text>

  <!-- the rule -->
  <path class="line" d="M80 906H1520"/>
  <text class="lbl accent" x="80" y="944" font-size="13">THE RULE</text>
  <text class="fg" x="240" y="945" font-size="18">A test that stubs the seam it is testing proves nothing. A test now drives real scheduled work against a real database.</text>
</svg>
