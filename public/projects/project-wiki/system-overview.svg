<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">Project Wiki system overview</title>
  <desc id="desc">Git and Notion connectors ingest sources into Postgres as stable coordinates, a retrieval index and a batched distillation engine turn them into a concept graph whose nodes thread back to source, and a browser, chat, and MCP server read that graph.</desc>
  <defs>
    <style>
      .bg{fill:#fcfcfd}
      .ink{fill:#202630}
      .copy{fill:#626b78}
      .muted{fill:#626b78}
      .accent{fill:#285bc5}
      .card{fill:#ffffff;stroke:#c6cedb;stroke-width:2}
      .hi{fill:#edf2fc;stroke:#91aade;stroke-width:2}
      .rule{fill:none;stroke:#c6cedb;stroke-width:1}
      .split{fill:none;stroke:#91aade;stroke-width:1;stroke-dasharray:6 6}
      .mono{font-family:'SFMono-Regular',Menlo,monospace}
      .lbl{font-family:'SFMono-Regular',Menlo,monospace;letter-spacing:1px}
      .flow{fill:none;stroke:#285bc5;stroke-width:2;marker-end:url(#ar)}
      .thread{fill:none;stroke:#91aade;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#at)}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
    <marker id="at" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#91aade"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <!-- header -->
  <text class="lbl muted" x="80" y="78" font-size="15">PROJECT WIKI · SYSTEM OVERVIEW</text>
  <text class="lbl muted" x="1520" y="78" font-size="15" text-anchor="end">INGEST · INDEX · DISTIL · SERVE</text>
  <path class="rule" d="M80 100H1520"/>

  <text class="ink" x="78" y="186" font-size="58" font-weight="600">Info goes in, knowledge comes out.</text>
  <text class="copy" x="80" y="228" font-size="20">Connectors ingest sources as stable coordinates. Distillation names what recurs, once — and every concept keeps a thread back to source.</text>

  <!-- info / knowledge split -->
  <text class="lbl muted" x="80" y="286" font-size="13">INFO — LITERAL SOURCE TEXT, SCATTERED AND REPEATED</text>
  <text class="lbl accent" x="832" y="286" font-size="13">KNOWLEDGE — NAMED ONCE, REUSED WITHOUT RE-READING</text>
  <path class="rule" d="M80 302H772"/>
  <path class="rule" d="M808 302H1520"/>
  <path class="split" d="M790 262V846"/>

  <!-- column headers -->
  <text class="lbl accent" x="80" y="336" font-size="13">01 / INGEST</text>
  <text class="lbl accent" x="412" y="336" font-size="13">02 / INDEX + DISTIL</text>
  <text class="lbl accent" x="832" y="336" font-size="13">03 / CONCEPT GRAPH</text>
  <text class="lbl accent" x="1214" y="336" font-size="13">04 / SERVE</text>

  <!-- column A: sources -->
  <rect rx="6" class="card" x="80" y="356" width="280" height="140"/>
  <text class="ink" x="100" y="396" font-size="21" font-weight="600">git connector</text>
  <text class="mono copy" x="100" y="426" font-size="13">dulwich · local clone</text>
  <text class="mono copy" x="100" y="450" font-size="13">tree-sitter symbol coords</text>
  <text class="mono copy" x="100" y="474" font-size="13">Python · JS · TS · C#</text>

  <rect rx="6" class="card" x="80" y="516" width="280" height="120"/>
  <text class="ink" x="100" y="556" font-size="21" font-weight="600">Notion connector</text>
  <text class="mono copy" x="100" y="586" font-size="13">notion-client · workspace</text>
  <text class="mono copy" x="100" y="610" font-size="13">page + block coordinates</text>

  <rect rx="6" class="card" x="80" y="656" width="280" height="134"/>
  <text class="ink" x="100" y="696" font-size="21" font-weight="600">Postgres coordinates</text>
  <text class="mono copy" x="100" y="726" font-size="13">document · source_ref</text>
  <text class="mono copy" x="100" y="750" font-size="13">git_symbol · git_lines</text>
  <text class="mono copy" x="100" y="774" font-size="13">notion_block</text>

  <path class="flow" d="M360 560H406"/>

  <!-- column B: engine -->
  <rect rx="6" class="card" x="412" y="356" width="336" height="140"/>
  <text class="ink" x="432" y="396" font-size="21" font-weight="600">Retrieval index</text>
  <text class="mono copy" x="432" y="426" font-size="13">structural, heading-aware chunks</text>
  <text class="mono copy" x="432" y="450" font-size="13">pgvector · text-embedding-3-small</text>
  <text class="mono copy" x="432" y="474" font-size="13">budget from the embedder's tokenizer</text>

  <rect rx="6" class="hi" x="412" y="516" width="336" height="170"/>
  <text class="ink" x="432" y="556" font-size="21" font-weight="600">Batched distillation</text>
  <text class="mono accent" x="432" y="586" font-size="13">file-aware batches · one call each</text>
  <text class="mono accent" x="432" y="610" font-size="13">one transaction per batch, committed</text>
  <text class="mono accent" x="432" y="634" font-size="13">dedup + merge · typed edges routed</text>
  <text class="mono accent" x="432" y="658" font-size="13">a failed batch is isolated, not fatal</text>

  <rect rx="6" class="card" x="412" y="706" width="336" height="84"/>
  <text class="ink" x="432" y="746" font-size="21" font-weight="600">Organise + review</text>
  <text class="mono copy" x="432" y="774" font-size="13">domains · cross-source edges · queue</text>

  <text class="lbl accent" x="789" y="590" font-size="12" text-anchor="middle">DISTIL</text>
  <path class="flow" d="M748 601H828"/>

  <!-- column C: concept graph -->
  <rect rx="6" class="hi" x="832" y="376" width="290" height="64"/>
  <text class="ink" x="852" y="404" font-size="19" font-weight="600">business rule</text>
  <text class="mono accent" x="852" y="426" font-size="12">layer · nature · lifecycle</text>

  <path class="flow" d="M977 440V482"/>
  <text class="mono accent" x="990" y="468" font-size="12">implements</text>

  <rect rx="6" class="card" x="832" y="486" width="290" height="64"/>
  <text class="ink" x="852" y="514" font-size="19" font-weight="600">contract / interface</text>
  <text class="mono copy" x="852" y="536" font-size="12">shared between two repos</text>

  <path class="flow" d="M977 550V592"/>
  <text class="mono accent" x="990" y="578" font-size="12">belongs-to-domain</text>

  <rect rx="6" class="card" x="832" y="596" width="290" height="64"/>
  <text class="ink" x="852" y="624" font-size="19" font-weight="600">domain / area</text>
  <text class="mono copy" x="852" y="646" font-size="12">structural chapter</text>

  <path class="rule" d="M832 692H1122"/>
  <text class="lbl muted" x="832" y="716" font-size="12">10 CORE TYPES · 8 EDGE TYPES</text>
  <text class="copy" x="832" y="744" font-size="14">Edges are proposed from evidence,</text>
  <text class="copy" x="832" y="766" font-size="14">never from similarity, and carry a</text>
  <text class="copy" x="832" y="788" font-size="14">confidence that routes them.</text>

  <path class="flow" d="M1162 560H1210"/>

  <!-- column D: consumers -->
  <rect rx="6" class="card" x="1214" y="356" width="306" height="140"/>
  <text class="ink" x="1234" y="396" font-size="21" font-weight="600">React browser</text>
  <text class="mono copy" x="1234" y="426" font-size="13">book view + provenance panel</text>
  <text class="mono copy" x="1234" y="450" font-size="13">relationships · history · graph</text>
  <text class="mono copy" x="1234" y="474" font-size="13">review queue · admin console</text>

  <rect rx="6" class="card" x="1214" y="516" width="306" height="120"/>
  <text class="ink" x="1234" y="556" font-size="21" font-weight="600">In-product chat</text>
  <text class="mono copy" x="1234" y="586" font-size="13">wiki first, drops to source</text>
  <text class="mono copy" x="1234" y="610" font-size="13">every answer states its scope</text>

  <rect rx="6" class="card" x="1214" y="656" width="306" height="134"/>
  <text class="ink" x="1234" y="696" font-size="21" font-weight="600">Coding agent · MCP</text>
  <text class="mono copy" x="1234" y="726" font-size="13">search_concepts · get_concept</text>
  <text class="mono copy" x="1234" y="750" font-size="13">list_chapters · whats_diverged</text>
  <text class="mono copy" x="1234" y="774" font-size="13">wiki answer + source pointers</text>

  <!-- provenance band -->
  <path class="thread" d="M832 812V890H220V794"/>
  <path class="thread" d="M912 812V902H280V794"/>
  <path class="thread" d="M992 812V914H340V794"/>

  <path class="rule" d="M80 936H1520"/>
  <text class="lbl accent" x="80" y="968" font-size="13">PROVENANCE</text>
  <text class="copy" x="280" y="969" font-size="15">Every node pins at least one source coordinate.</text>
  <text class="mono muted" x="1520" y="968" font-size="12" text-anchor="end">the node store rejects a node created with none</text>
</svg>
