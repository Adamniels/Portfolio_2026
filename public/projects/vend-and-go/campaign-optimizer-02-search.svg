<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .bg    { fill: #fcfcfd; }
      .fg    { fill: #202630; }
      .muted { fill: #626b78; }
      .green { fill: #285bc5; }
      .coral { fill: #b6423a; }
      .mono  { font-family:  'SFMono-Regular', Menlo, monospace; }
      .lbl   { font-family:  'SFMono-Regular', Menlo, monospace; letter-spacing: 1px; }
      .line  { stroke: #c6cedb; stroke-width: 1; }
      .egreen{ stroke: #285bc5; stroke-width: 1.5; fill: none; }
      .ecoral{ stroke: #b6423a; stroke-width: 1.5; fill: none; }
      .nbox  { fill: none; stroke: #c6cedb; stroke-width: 1; }
      .nboxg { fill: none; stroke: #285bc5; stroke-width: 1.5; }
      .nboxc { fill: none; stroke: #b6423a; stroke-width: 1.5; }
    
      rect.nbox, rect.box { fill: #ffffff; }
      rect.nboxg, rect.boxa { fill: #edf2fc; }
      rect.nboxc, rect.boxn { fill: #fcf0ee; }
    </style>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#285bc5"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b6423a"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <!-- header -->
  <text class="lbl muted" x="80" y="78" font-size="15">CAMPAIGN OPTIMIZER</text>
  <text class="lbl muted" x="1520" y="78" font-size="15" text-anchor="end">02 / RECURSIVE SEARCH &amp; MEMOIZATION</text>
  <line class="line" x1="80" y1="100" x2="1520" y2="100"/>

  <!-- title -->
  <text class="fg" x="78" y="196" font-size="64" font-weight="600">Search the states, not the units.</text>
  <text class="muted" x="80" y="244" font-size="21">At each grouped state the solver applies a bundle, removes those units, and recurses on the rest.</text>

  <!-- =============== LANE 1: OPTIMAL / CONVERGING =============== -->
  <text class="lbl green" x="80" y="322" font-size="14">OPTIMAL PATH — TWO DISJOINT BUNDLES, EITHER ORDER</text>
  <line class="line" x1="80" y1="338" x2="1520" y2="338"/>

  <!-- edges lane1 -->
  <path class="egreen" marker-end="url(#ag)" d="M300,458 L462,412"/>
  <path class="egreen" marker-end="url(#ag)" d="M300,498 L462,566"/>
  <path class="egreen" marker-end="url(#ag)" d="M672,412 L842,458"/>
  <path class="egreen" marker-end="url(#ag)" d="M672,566 L842,498"/>
  <path class="egreen" marker-end="url(#ag)" d="M1012,478 L1132,478"/>

  <!-- edge labels lane1 -->
  <text class="mono green" x="322" y="416" font-size="14">Soda Twins −12</text>
  <text class="mono green" x="322" y="560" font-size="14">Water Pair −12</text>
  <text class="mono green" x="690" y="430" font-size="14">then Water Pair −12</text>
  <text class="mono green" x="690" y="556" font-size="14">then Soda Twins −12</text>
  <text class="mono green" x="1016" y="466" font-size="14">Juice Deal −18</text>

  <!-- root -->
  <rect rx="6" class="nbox" x="80" y="432" width="220" height="92"/>
  <text class="mono fg" x="190" y="472" font-size="20" text-anchor="middle">A:2 | B:1 | C:2</text>
  <text class="mono muted" x="190" y="500" font-size="13" text-anchor="middle">solve root · best 42</text>

  <!-- N1 -->
  <rect rx="6" class="nbox" x="472" y="374" width="200" height="76"/>
  <text class="mono fg" x="572" y="410" font-size="19" text-anchor="middle">B:1 | C:2</text>
  <text class="mono muted" x="572" y="434" font-size="13" text-anchor="middle">best 30</text>

  <!-- N2 -->
  <rect rx="6" class="nbox" x="472" y="528" width="200" height="76"/>
  <text class="mono fg" x="572" y="564" font-size="19" text-anchor="middle">A:2 | B:1</text>
  <text class="mono muted" x="572" y="588" font-size="13" text-anchor="middle">best 30</text>

  <!-- converge C -->
  <rect rx="6" class="nboxg" x="842" y="432" width="170" height="92"/>
  <text class="mono green" x="927" y="470" font-size="22" text-anchor="middle">B:1</text>
  <text class="mono green" x="927" y="498" font-size="12" text-anchor="middle">computed once → reused</text>

  <!-- final -->
  <rect rx="6" class="nboxg" x="1132" y="432" width="188" height="92"/>
  <text class="mono green" x="1226" y="474" font-size="30" text-anchor="middle" font-weight="600">42 kr</text>
  <text class="mono muted" x="1226" y="502" font-size="13" text-anchor="middle">total discount</text>

  <!-- memo band -->
  <line class="line" x1="80" y1="612" x2="1520" y2="612"/>
  <rect x="80" y="636" width="15" height="15" fill="none" class="nboxg"/>
  <text class="mono green" x="108" y="649" font-size="15">memo</text>
  <text class="mono muted" x="205" y="649" font-size="14">Both orderings reach key B:1. Units are counts, not objects — so [Twins, Water] and [Water, Twins] collapse to one state, whose 18 kr result is cached and reused.</text>

  <!-- =============== LANE 2: REJECTED / TRAP =============== -->
  <text class="lbl coral" x="80" y="742" font-size="14">REJECTED — TAKING THE BIGGEST SINGLE DISCOUNT FIRST</text>
  <line class="line" x1="80" y1="758" x2="1520" y2="758"/>

  <!-- edges lane2 -->
  <path class="ecoral" marker-end="url(#ac)" d="M300,838 L462,838"/>
  <path class="ecoral" marker-end="url(#ac)" d="M672,838 L842,838"/>
  <path class="ecoral" marker-end="url(#ac)" d="M1012,838 L1132,838"/>
  <text class="mono coral" x="320" y="824" font-size="14">Soda + Juice Meal −20</text>
  <text class="mono coral" x="702" y="824" font-size="14">Water Pair −12</text>

  <rect rx="6" class="nbox" x="80" y="800" width="220" height="76"/>
  <text class="mono muted" x="190" y="836" font-size="19" text-anchor="middle">A:2 | B:1 | C:2</text>
  <text class="mono muted" x="190" y="860" font-size="13" text-anchor="middle">same root</text>

  <rect rx="6" class="nbox" x="472" y="800" width="200" height="76"/>
  <text class="mono fg" x="572" y="836" font-size="19" text-anchor="middle">A:1 | C:2</text>
  <text class="mono muted" x="572" y="860" font-size="13" text-anchor="middle">1 soda stranded</text>

  <rect rx="6" class="nboxc" x="842" y="800" width="200" height="76"/>
  <text class="mono fg" x="942" y="836" font-size="19" text-anchor="middle">A:1</text>
  <text class="mono coral" x="942" y="860" font-size="13" text-anchor="middle">no campaign left</text>

  <rect rx="6" class="nboxc" x="1132" y="800" width="188" height="76"/>
  <text class="mono coral" x="1226" y="840" font-size="28" text-anchor="middle" font-weight="600">32 kr</text>
  <text class="mono muted" x="1226" y="862" font-size="12" text-anchor="middle">10 kr worse</text>

  <text class="mono muted" x="80" y="936" font-size="15.5">The −20 kr Meal spends the juice (blocking Juice Deal −18) and leaves one lone soda (Twins needs two). Biggest-first gives 32 kr; the optimal weave gives 42 kr.</text>
</svg>
