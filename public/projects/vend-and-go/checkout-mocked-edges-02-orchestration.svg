<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .bg    { fill: #171715; }
      .fg    { fill: #F0EEE8; }
      .muted { fill: #8A867C; }
      .green { fill: #C8FF32; }
      .coral { fill: #ED5B3A; }
      .mono  { font-family: 'DM Mono', 'SFMono-Regular', Menlo, monospace; }
      .lbl   { font-family: 'DM Mono', 'SFMono-Regular', Menlo, monospace; letter-spacing: 2px; }
      .line  { stroke: #3A3833; stroke-width: 1; }
      .nbox  { fill: none; stroke: #3A3833; stroke-width: 1; }
      .nboxg { fill: none; stroke: #C8FF32; stroke-width: 1.5; }
      .nboxc { fill: none; stroke: #ED5B3A; stroke-width: 1.5; }
    </style>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C8FF32"/></marker>
    <marker id="am" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8A867C"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <!-- header -->
  <text class="lbl muted" x="80" y="78" font-size="15">CHECKOUT · MOCKED EDGES</text>
  <text class="lbl muted" x="1520" y="78" font-size="15" text-anchor="end">02 / ORCHESTRATION &amp; STATE</text>
  <line class="line" x1="80" y1="100" x2="1520" y2="100"/>

  <!-- title -->
  <text class="fg" x="78" y="188" font-size="60" font-weight="600">Reserve, dispense, settle.</text>
  <text class="muted" x="80" y="230" font-size="21">The use case coordinates the whole run. Two steps cross a mocked edge — payment and machine; the rest is real application code.</text>

  <!-- ===== orchestration steps ===== -->
  <text class="lbl green" x="80" y="300" font-size="14">EXECUTION ORDER — CHECKOUTCARTUSECASE.EXECUTE</text>
  <line class="line" x1="80" y1="316" x2="1520" y2="316"/>

  <!-- step boxes -->
  <!-- 1 -->
  <rect class="nboxc" x="80" y="346" width="212" height="118"/>
  <text class="mono green" x="98" y="374" font-size="13">01</text>
  <text class="fg" x="98" y="400" font-size="19">Reserve</text>
  <text class="mono muted" x="98" y="424" font-size="11.5">paymentService.reserve</text>
  <text class="mono muted" x="98" y="441" font-size="11.5">amount = net (48)</text>
  <text class="mono coral" x="98" y="458" font-size="11">▸ mock edge · payment</text>
  <!-- 2 -->
  <rect class="nboxc" x="320" y="346" width="212" height="118"/>
  <text class="mono green" x="338" y="374" font-size="13">02</text>
  <text class="fg" x="338" y="400" font-size="19">Dispense</text>
  <text class="mono muted" x="338" y="424" font-size="11.5">dispenseOne() per unit</text>
  <text class="mono muted" x="338" y="441" font-size="11.5">tally ok / failed</text>
  <text class="mono coral" x="338" y="458" font-size="11">▸ mock edge · machine</text>
  <!-- 3 -->
  <rect class="nbox" x="560" y="346" width="212" height="118"/>
  <text class="mono green" x="578" y="374" font-size="13">03</text>
  <text class="fg" x="578" y="400" font-size="19">Settle</text>
  <text class="mono muted" x="578" y="424" font-size="11.5">capture=min(reserved,Σ)</text>
  <text class="mono muted" x="578" y="441" font-size="11.5">refund = reserved − capt.</text>
  <text class="mono muted" x="578" y="458" font-size="11">scaled to net price</text>
  <!-- 4 -->
  <rect class="nbox" x="800" y="346" width="212" height="118"/>
  <text class="mono green" x="818" y="374" font-size="13">04</text>
  <text class="fg" x="818" y="400" font-size="19">Inventory</text>
  <text class="mono muted" x="818" y="424" font-size="11.5">productBatch.decrement</text>
  <text class="mono muted" x="818" y="441" font-size="11.5">dispensed units only</text>
  <text class="mono coral" x="818" y="458" font-size="11">fail → reconcile · 409</text>
  <!-- 5 -->
  <rect class="nbox" x="1040" y="346" width="212" height="118"/>
  <text class="mono green" x="1058" y="374" font-size="13">05</text>
  <text class="fg" x="1058" y="400" font-size="19">Persist</text>
  <text class="mono muted" x="1058" y="424" font-size="11.5">saveDispenseResult</text>
  <text class="mono muted" x="1058" y="441" font-size="11.5">status + item rows</text>
  <text class="mono muted" x="1058" y="458" font-size="11">real repository</text>
  <!-- 6 -->
  <rect class="nboxc" x="1280" y="346" width="212" height="118"/>
  <text class="mono green" x="1298" y="374" font-size="13">06</text>
  <text class="fg" x="1298" y="400" font-size="19">Finalize</text>
  <text class="mono muted" x="1298" y="424" font-size="11.5">capture + refund</text>
  <text class="mono muted" x="1298" y="441" font-size="11.5">retry ×2</text>
  <text class="mono coral" x="1298" y="458" font-size="11">▸ mock edge · payment</text>

  <!-- arrows between steps -->
  <path class="egreen" stroke="#C8FF32" stroke-width="1.5" fill="none" marker-end="url(#ag)" d="M292,405 L316,405"/>
  <path stroke="#C8FF32" stroke-width="1.5" fill="none" marker-end="url(#ag)" d="M532,405 L556,405"/>
  <path stroke="#C8FF32" stroke-width="1.5" fill="none" marker-end="url(#ag)" d="M772,405 L796,405"/>
  <path stroke="#C8FF32" stroke-width="1.5" fill="none" marker-end="url(#ag)" d="M1012,405 L1036,405"/>
  <path stroke="#C8FF32" stroke-width="1.5" fill="none" marker-end="url(#ag)" d="M1252,405 L1276,405"/>

  <text class="mono muted" x="80" y="500" font-size="13">After finalize: clear cart only if captured &gt; 0, then save order and award loyalty points for the dispensed portion.</text>

  <!-- ===== LEFT: synthetic example ===== -->
  <text class="lbl green" x="80" y="566" font-size="14">SYNTHETIC EXAMPLE · 2 ITEMS · PARTIAL DISPENSE</text>
  <line class="line" x1="80" y1="582" x2="760" y2="582"/>
  <text class="mono muted" x="80" y="616" font-size="14">cart 60 kr  −  campaign 12  =  net 48 kr reserved</text>

  <!-- table header -->
  <text class="lbl muted" x="80"  y="662" font-size="12">PRODUCT</text>
  <text class="lbl muted" x="470" y="662" font-size="12" text-anchor="end">REQ</text>
  <text class="lbl muted" x="545" y="662" font-size="12" text-anchor="end">OK</text>
  <text class="lbl muted" x="620" y="662" font-size="12" text-anchor="end">FAIL</text>
  <text class="lbl muted" x="700" y="662" font-size="12" text-anchor="end">CAPT</text>
  <text class="lbl muted" x="760" y="662" font-size="12" text-anchor="end">REF</text>
  <line class="line" x1="80" y1="676" x2="760" y2="676"/>

  <!-- row Water -->
  <text class="fg"   x="80"  y="710" font-size="17">Sparkling Water</text>
  <text class="mono muted" x="80" y="728" font-size="11">15 kr / unit</text>
  <text class="mono fg"    x="470" y="712" font-size="16" text-anchor="end">2</text>
  <text class="mono green" x="545" y="712" font-size="16" text-anchor="end">1</text>
  <text class="mono coral" x="620" y="712" font-size="16" text-anchor="end">1</text>
  <text class="mono fg"    x="700" y="712" font-size="16" text-anchor="end">12</text>
  <text class="mono fg"    x="760" y="712" font-size="16" text-anchor="end">12</text>
  <line class="line" x1="80" y1="742" x2="760" y2="742"/>

  <!-- row Bar -->
  <text class="fg"   x="80"  y="776" font-size="17">Energy Bar</text>
  <text class="mono muted" x="80" y="794" font-size="11">30 kr / unit</text>
  <text class="mono fg"    x="470" y="778" font-size="16" text-anchor="end">1</text>
  <text class="mono green" x="545" y="778" font-size="16" text-anchor="end">1</text>
  <text class="mono muted" x="620" y="778" font-size="16" text-anchor="end">0</text>
  <text class="mono fg"    x="700" y="778" font-size="16" text-anchor="end">24</text>
  <text class="mono muted" x="760" y="778" font-size="16" text-anchor="end">0</text>
  <line class="line" x1="80" y1="808" x2="760" y2="808"/>

  <!-- totals -->
  <text class="lbl muted" x="80" y="842" font-size="12">TOTALS</text>
  <text class="mono fg"    x="470" y="844" font-size="16" text-anchor="end">3</text>
  <text class="mono green" x="545" y="844" font-size="16" text-anchor="end">2</text>
  <text class="mono coral" x="620" y="844" font-size="16" text-anchor="end">1</text>
  <text class="mono green" x="700" y="844" font-size="16" text-anchor="end">36</text>
  <text class="mono fg"    x="760" y="844" font-size="16" text-anchor="end">12</text>

  <text class="mono muted" x="80" y="892" font-size="13">captured 36 + refunded 12 = 48 reserved · inventory −1 Water, −1 Bar · cart cleared (captured &gt; 0)</text>

  <!-- ===== RIGHT: state transitions ===== -->
  <text class="lbl green" x="880" y="566" font-size="14">STATE TRANSITIONS — THIS RUN ★</text>
  <line class="line" x1="880" y1="582" x2="1520" y2="582"/>

  <!-- order.status -->
  <text class="lbl muted" x="880" y="624" font-size="12">ORDER.STATUS</text>
  <rect class="nboxc" x="880" y="636" width="150" height="40"/>
  <text class="mono coral" x="955" y="661" font-size="14" text-anchor="middle">FAILED</text>
  <path stroke="#8A867C" fill="none" marker-end="url(#am)" d="M1030,656 L1078,656"/>
  <!-- three terminals -->
  <rect class="nbox" x="1086" y="612" width="140" height="34"/>
  <text class="mono muted" x="1156" y="634" font-size="13" text-anchor="middle">PAID</text>
  <rect class="nboxg" x="1086" y="654" width="200" height="34"/>
  <text class="mono green" x="1186" y="676" font-size="13" text-anchor="middle">★ PARTIALLY_PAID</text>
  <rect class="nbox" x="1086" y="696" width="140" height="34"/>
  <text class="mono muted" x="1156" y="718" font-size="13" text-anchor="middle">FAILED</text>

  <!-- paymentStatus -->
  <text class="lbl muted" x="880" y="778" font-size="12">PAYMENT.STATUS</text>
  <rect class="nboxc" x="880" y="792" width="150" height="38"/>
  <text class="mono coral" x="955" y="816" font-size="12.5" text-anchor="middle">RESERVE_FAILED</text>
  <path stroke="#C8FF32" fill="none" marker-end="url(#ag)" d="M1030,811 L1064,811"/>
  <rect class="nbox" x="1072" y="792" width="120" height="38"/>
  <text class="mono fg" x="1132" y="816" font-size="13" text-anchor="middle">RESERVED</text>
  <path stroke="#8A867C" fill="none" marker-end="url(#am)" d="M1192,811 L1226,811"/>
  <rect class="nboxg" x="1234" y="792" width="238" height="38"/>
  <text class="mono green" x="1353" y="816" font-size="12.5" text-anchor="middle">★ PARTIALLY_CAPTURED</text>
  <text class="mono muted" x="880" y="878" font-size="12.5">other settle outcomes: CAPTURED (all ok) · REFUNDED (none dispensed)</text>
</svg>
