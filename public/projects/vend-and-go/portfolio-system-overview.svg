<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Vend &amp; Go system architecture</title>
  <desc id="desc">Customer and refiller clients share contracts with a NestJS modular monolith. Six backend modules own the business rules. PostgreSQL, file storage, payment, dispensing and push integrations sit at the infrastructure boundary. Payment and dispensing providers are mocked; push uses Expo.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #202630; }
      .bg { fill: #fcfcfd; }
      .title { font-size: 48px; font-weight: 600; letter-spacing: -1.5px; }
      .heading { font-size: 23px; font-weight: 600; }
      .copy { font-size: 19px; fill: #626b78; }
      .small { font-size: 16px; fill: #626b78; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
      .label { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 15px; letter-spacing: 1px; fill: #626b78; }
      .accent { fill: #285bc5; }
      .warning { fill: #93621a; }
      .panel { fill: #f3f5f8; stroke: #c6cedb; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #c6cedb; stroke-width: 1.5; }
      .core { fill: #edf2fc; stroke: #91aade; stroke-width: 1.5; }
      .mock { fill: #fff6e8; stroke: #ccab70; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .rule { fill: none; stroke: #c6cedb; stroke-width: 1.5; }
      .flow { fill: none; stroke: #285bc5; stroke-width: 2; marker-end: url(#arrow); }
      .boundary { fill: none; stroke: #91aade; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285bc5"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1120"/>
  <text class="label" x="70" y="64">VEND &amp; GO / SYSTEM ARCHITECTURE</text>
  <text class="label" x="1530" y="64" text-anchor="end">CLIENTS · CORE · ADAPTERS</text>
  <path class="rule" d="M70 88H1530"/>
  <text class="title" x="68" y="164">One backend owns the business rules.</text>
  <text class="copy" x="70" y="208">Shared contracts connect both clients. External providers stay behind replaceable interfaces.</text>

  <text class="label accent" x="70" y="280">01 / CLIENTS</text>
  <text class="label accent" x="420" y="280">02 / APPLICATION BACKEND</text>
  <text class="label accent" x="1120" y="280">03 / INFRASTRUCTURE &amp; PROVIDERS</text>

  <rect class="card" x="70" y="310" width="290" height="148" rx="6"/>
  <text class="heading" x="94" y="350">Customer mobile app</text>
  <text class="copy" x="94" y="386">Expo / React Native</text>
  <text class="small mono" x="94" y="426">apps/mobile</text>

  <rect class="card" x="70" y="482" width="290" height="148" rx="6"/>
  <text class="heading" x="94" y="522">Admin / refiller console</text>
  <text class="copy" x="94" y="558">React web client</text>
  <text class="small mono" x="94" y="598">apps/admin-web</text>

  <path class="flow" d="M215 630V672"/>
  <path class="flow" d="M70 384H46V728H70"/>
  <rect class="core" x="70" y="674" width="290" height="110" rx="6"/>
  <text class="heading" x="94" y="714">Shared contracts</text>
  <text class="small mono" x="94" y="752">packages/contracts</text>
  <path class="flow" d="M360 728H390V414H442"/>

  <rect class="panel" x="420" y="310" width="630" height="596" rx="8"/>
  <text class="heading" x="444" y="350">NestJS · modular monolith</text>
  <text class="small mono" x="1026" y="350" text-anchor="end">apps/api</text>
  <rect class="card" x="444" y="374" width="582" height="90" rx="6"/>
  <text class="heading" x="466" y="410">REST API / controllers</text>
  <text class="small" x="466" y="443">Authenticated JSON over HTTPS</text>
  <path class="flow" d="M735 464V500"/>

  <rect class="card" x="444" y="504" width="280" height="96" rx="6"/>
  <text class="heading" x="464" y="542">Auth &amp; users</text>
  <text class="small mono" x="464" y="575">auth · users</text>
  <rect class="card" x="746" y="504" width="280" height="96" rx="6"/>
  <text class="heading" x="766" y="542">Machines &amp; locations</text>
  <text class="small mono" x="766" y="575">vending-machine</text>

  <rect class="card" x="444" y="620" width="280" height="96" rx="6"/>
  <text class="heading" x="464" y="658">Products &amp; inventory</text>
  <text class="small mono" x="464" y="691">product-type · batch</text>
  <rect class="core" x="746" y="620" width="280" height="96" rx="6"/>
  <text class="heading" x="766" y="658">Campaigns &amp; pricing</text>
  <text class="small mono" x="766" y="691">campaign</text>

  <rect class="core" x="444" y="736" width="280" height="96" rx="6"/>
  <text class="heading" x="464" y="774">Loyalty &amp; rewards</text>
  <text class="small mono" x="464" y="807">loyalty</text>
  <rect class="core" x="746" y="736" width="280" height="96" rx="6"/>
  <text class="heading" x="766" y="774">Purchasing &amp; checkout</text>
  <text class="small mono" x="766" y="807">cart · checkout · orders</text>
  <text class="small" x="444" y="875">Presentation → application → domain. Ports at the edge.</text>

  <path class="boundary" d="M1084 310V980"/>
  <path d="M1050 602H1100M1100 361V897" fill="none" stroke="#285bc5" stroke-width="2"/>
  <path class="flow" d="M1100 361H1118"/>
  <path class="flow" d="M1100 483H1118"/>
  <path class="flow" d="M1100 617H1118"/>
  <path class="flow" d="M1100 763H1118"/>
  <path class="flow" d="M1100 897H1118"/>
  <text class="label accent" x="1072" y="554" text-anchor="middle" transform="rotate(-90 1072 554)">PORTS</text>

  <rect class="card" x="1120" y="310" width="410" height="102" rx="6"/>
  <text class="heading" x="1144" y="350">PostgreSQL</text>
  <text class="copy" x="1144" y="387">Persistent data through Prisma</text>

  <rect class="card" x="1120" y="432" width="410" height="102" rx="6"/>
  <text class="heading" x="1144" y="472">File storage</text>
  <text class="copy" x="1144" y="509">Product images and logos</text>

  <rect class="mock" x="1120" y="554" width="410" height="126" rx="6"/>
  <text class="heading" x="1144" y="594">Payment adapter</text>
  <text class="label warning" x="1506" y="594" text-anchor="end">MOCK</text>
  <text class="small mono" x="1144" y="629">IPaymentService</text>
  <text class="small" x="1144" y="658">Production provider not yet integrated</text>

  <rect class="mock" x="1120" y="700" width="410" height="126" rx="6"/>
  <text class="heading" x="1144" y="740">Dispensing adapter</text>
  <text class="label warning" x="1506" y="740" text-anchor="end">MOCK</text>
  <text class="small mono" x="1144" y="775">IMachineDispenseService</text>
  <text class="small" x="1144" y="804">Physical vending hardware is mocked</text>

  <rect class="card" x="1120" y="846" width="410" height="102" rx="6"/>
  <text class="heading" x="1144" y="886">Push adapter</text>
  <text class="copy" x="1144" y="923">Expo SDK → Expo Push service</text>

  <path class="rule" d="M70 1010H1530"/>
  <rect class="mock" x="70" y="1040" width="18" height="18" rx="3"/>
  <text class="small" x="100" y="1055">Mocked, replaceable integration</text>
  <rect class="core" x="450" y="1040" width="18" height="18" rx="3"/>
  <text class="small" x="480" y="1055">Core business logic and contracts</text>
  <text class="label" x="1530" y="1055" text-anchor="end">ONE DEPLOYABLE BACKEND</text>
</svg>
