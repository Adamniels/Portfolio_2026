<line class="ln" x1="56" y1="60" x2="1744" y2="60"/>
<text class="sec" x="56" y="88" font-size="15">Shared contracts connect the mobile and console clients to one backend. Persistence and replaceable payment and dispensing adapters sit at the boundary.</text>
